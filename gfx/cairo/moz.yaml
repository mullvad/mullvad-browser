schema: 1

bugzilla:
  product: Core
  component: Graphics

origin:
  name: Cairo

  description: "Cairo: Multi-platform 2D graphics library"

  url: https://www.cairographics.org

  release: 1.18.4 (2025-03-08T13:23:25Z).
  revision: 1.18.4

  license: 'MPL-1.1'
  license-file: 'COPYING-MPL-1.1'

vendoring:
  url: https://gitlab.freedesktop.org/cairo/cairo
  source-hosting: gitlab
  tracking: tag
  vendor-directory: gfx/cairo/cairo

  # Upstream's history contains a malformed commit object
  # (e5b831b107ad18e78ec9ea5e6da68eb30bf71126) that predates git's fsck
  # validation and fails it (missing space before the author/committer
  # date). It has nothing to do with any revision we actually vendor;
  # it's just unreachable history that a clone would otherwise refuse
  # to transfer.
  tolerate-git-fsck-errors: true

  exclude:
    - boilerplate
    - build
    - doc
    - ".git*"
    - "meson*"
    - "src/meson*"
    - perf
    - subprojects
    - test
    - util

  patches:
    - patches/0001-Allow-cairo_public-to-be-predefined.patch
    - patches/0002-Work-around-lack-of-full-configure-support-for-xrend.patch
    - patches/0003-Avoid-register-keyword-for-C-compatibility.patch
